<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>30-Day Java &amp; Spring Mastery</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" />
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  :root {
    --bg: #1a1a1a;
    --sidebar-bg: #282828;
    --card-bg: #2d2d2d;
    --border: #3e3e3e;
    --text: #eff1f6;
    --text-dim: #9ca3af;
    --accent: #ffa116;
    --green: #2db55d;
    --easy: #00b8a3;
    --medium: #ffb800;
    --hard: #ff375f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  /* Sidebar */
  #sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #sidebar-header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
  }
  #sidebar-header h1 .accent { color: var(--accent); }
  #progress-wrap { margin-top: 12px; }
  #progress-bar-bg {
    height: 8px;
    background: #3e3e3e;
    border-radius: 4px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: var(--green);
    transition: width 0.3s ease;
  }
  #progress-text {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  #day-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    padding: 4px 0 8px;
  }
  .week-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px 6px;
    cursor: pointer;
    user-select: none;
  }
  .week-header:hover .week-title { color: var(--text); }
  .week-caret {
    font-size: 10px;
    color: var(--text-dim);
    transition: transform 0.15s;
    width: 10px;
  }
  .week-group.collapsed .week-caret { transform: rotate(-90deg); }
  .week-info { flex: 1; min-width: 0; }
  .week-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    transition: color 0.15s;
  }
  .week-sub { font-size: 11px; color: #6b7280; margin-top: 1px; }
  .week-count {
    font-size: 11px;
    color: var(--text-dim);
    background: #333;
    border-radius: 10px;
    padding: 1px 8px;
    white-space: nowrap;
  }
  .week-group.collapsed .day-item { display: none; }
  .day-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s;
  }
  .day-item:hover { background: #333; }
  .day-item.active {
    background: #353535;
    border-left-color: var(--accent);
  }
  .day-check {
    width: 18px;
    height: 18px;
    min-width: 18px;
    border-radius: 50%;
    border: 2px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: transparent;
  }
  .day-item.done .day-check {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .day-meta { flex: 1; min-width: 0; }
  .day-num { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .day-title {
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .day-item.done .day-title { color: var(--text-dim); }
  .diff-dot { font-size: 11px; font-weight: 600; }
  .diff-Easy { color: var(--easy); }
  .diff-Medium { color: var(--medium); }
  .diff-Hard { color: var(--hard); }
  /* Content */
  #content {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }
  #content-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 48px 120px;
  }
  #content-toolbar {
    position: sticky;
    top: 0;
    background: rgba(26,26,26,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 14px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  #toolbar-title { font-size: 15px; font-weight: 600; }
  .mark-btn {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .mark-btn:hover { background: rgba(45,181,93,0.12); }
  .mark-btn.done {
    background: var(--green);
    color: #fff;
  }
  /* Markdown styling */
  .md h1 { font-size: 28px; margin: 8px 0 18px; line-height: 1.3; }
  .md h2 { font-size: 21px; margin: 32px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .md h3 { font-size: 17px; margin: 24px 0 10px; color: var(--accent); }
  .md p { margin: 12px 0; line-height: 1.7; color: #d4d4d4; }
  .md ul, .md ol { margin: 12px 0 12px 24px; line-height: 1.7; color: #d4d4d4; }
  .md li { margin: 5px 0; }
  .md code {
    background: #333;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    color: #ff9f6b;
  }
  .md pre {
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    margin: 16px 0;
  }
  .md pre code { background: none; padding: 0; color: #e6e6e6; }
  .md blockquote {
    border-left: 3px solid var(--accent);
    padding: 4px 16px;
    margin: 16px 0;
    color: var(--text-dim);
    background: #262626;
    border-radius: 0 6px 6px 0;
  }
  .md table { border-collapse: collapse; margin: 16px 0; width: 100%; }
  .md th, .md td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .md th { background: #333; }
  .md a { color: var(--accent); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .header-block {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    margin: 18px 0;
  }
  #placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    text-align: center;
    padding: 40px;
  }
  #placeholder h2 { color: var(--text); margin-bottom: 10px; }
  .error-box {
    background: rgba(255,55,95,0.1);
    border: 1px solid var(--hard);
    border-radius: 8px;
    padding: 16px;
    color: #ffb3c1;
  }
  .error-box code { background: #2a1a1f; color: #ff9f6b; }
</style>
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1><span class="accent">30 Days</span> of Java &amp; Spring Mastery</h1>
      <div id="progress-wrap">
        <div id="progress-bar-bg"><div id="progress-bar"></div></div>
        <div id="progress-text">0 / 30 completed</div>
      </div>
    </div>
    <ul id="day-list"></ul>
  </aside>
  <main id="content">
    <div id="content-toolbar" style="display:none;">
      <span id="toolbar-title"></span>
      <button class="mark-btn" id="mark-btn">Mark as Done</button>
    </div>
    <div id="content-inner">
      <div id="placeholder">
        <h2>Pick a day to begin →</h2>
        <p>Each challenge takes about an hour. Concepts build on each other, so go in order.</p>
      </div>
    </div>
  </main>

<script>
const DAYS = [
  { day: 1,  title: "Build Tooling & a Write-Ahead Log",          diff: "Easy",   tool: "Maven" },
  { day: 2,  title: "Collections, Generics & a Hash Index",        diff: "Easy",   tool: "JUnit 5" },
  { day: 3,  title: "Streams & a Volcano Query Iterator",          diff: "Easy",   tool: "AssertJ" },
  { day: 4,  title: "Concurrency & a Producer-Consumer Queue",     diff: "Medium", tool: "SLF4J / Logback" },
  { day: 5,  title: "Immutability, Records & Copy-on-Write MVCC",  diff: "Medium", tool: "Lombok" },
  { day: 6,  title: "NIO, Page-Based Storage & a B-Tree",          diff: "Hard",   tool: "Jackson" },
  { day: 7,  title: "Error Handling, Optional & Idempotency",      diff: "Easy",   tool: "Gradle" },
  { day: 8,  title: "Spring IoC & Dependency Injection",           diff: "Easy",   tool: "Spring Core" },
  { day: 9,  title: "Spring Boot & Connection Pooling",            diff: "Medium", tool: "Spring Boot / HikariCP" },
  { day: 10, title: "REST APIs & Idempotent HTTP",                 diff: "Medium", tool: "Spring Web MVC" },
  { day: 11, title: "JDBC, Transactions & Isolation Levels",       diff: "Medium", tool: "Spring JDBC / H2" },
  { day: 12, title: "JPA, Hibernate & the N+1 Problem",            diff: "Medium", tool: "Spring Data JPA" },
  { day: 13, title: "Schema Migrations with Flyway",               diff: "Easy",   tool: "Flyway" },
  { day: 14, title: "Validation, DTOs & API Contracts",            diff: "Medium", tool: "Hibernate Validator / MapStruct" },
  { day: 15, title: "Caching & LRU/LFU Eviction",                  diff: "Medium", tool: "Caffeine" },
  { day: 16, title: "Distributed Caching with Redis",              diff: "Medium", tool: "Spring Data Redis" },
  { day: 17, title: "Transactions, Propagation & 2PC",             diff: "Hard",   tool: "Spring TX" },
  { day: 18, title: "Kafka, Partitions & the Log",                 diff: "Hard",   tool: "Spring Kafka" },
  { day: 19, title: "Event Sourcing",                              diff: "Hard",   tool: "Spring Events / Kafka" },
  { day: 20, title: "The Transactional Outbox Pattern",            diff: "Hard",   tool: "Kafka + JPA" },
  { day: 21, title: "Indexing & Query Optimization",              diff: "Medium", tool: "PostgreSQL / EXPLAIN" },
  { day: 22, title: "Sharding & Consistent Hashing",               diff: "Hard",   tool: "Custom" },
  { day: 23, title: "Integration Testing with Testcontainers",     diff: "Medium", tool: "Testcontainers" },
  { day: 24, title: "Resilience: Retries & Circuit Breakers",      diff: "Medium", tool: "Resilience4j" },
  { day: 25, title: "Observability: Metrics & Tracing",            diff: "Medium", tool: "Micrometer / Prometheus" },
  { day: 26, title: "Security with Spring Security & JWT",          diff: "Hard",   tool: "Spring Security" },
  { day: 27, title: "Rate Limiting with Token Buckets",            diff: "Medium", tool: "Bucket4j" },
  { day: 28, title: "Distributed Locks & Leader Election",         diff: "Hard",   tool: "Redis / ZooKeeper" },
  { day: 29, title: "Reactive Programming & Backpressure",         diff: "Hard",   tool: "Spring WebFlux" },
  { day: 30, title: "Capstone: A Distributed Order System & CAP",  diff: "Hard",   tool: "Full stack" },
];

const WEEKS = [
  { num: 1, title: "Week 1 · Java Core & Internals",            sub: "Language, tooling & DB-internals from scratch", from: 1,  to: 7  },
  { num: 2, title: "Week 2 · Spring & Persistence",             sub: "IoC, Boot, REST, JDBC & JPA",                  from: 8,  to: 14 },
  { num: 3, title: "Week 3 · Data at Scale & Distributed",      sub: "Caching, transactions, Kafka & sharding",      from: 15, to: 22 },
  { num: 4, title: "Week 4 · Production Engineering",           sub: "Testing, resilience, security & the capstone", from: 23, to: 30 },
];

const STORAGE_KEY = "java30_done";
const WEEK_COLLAPSE_KEY = "java30_collapsed";
function getCollapsed() {
  try { return JSON.parse(localStorage.getItem(WEEK_COLLAPSE_KEY)) || {}; }
  catch (e) { return {}; }
}
function setCollapsed(c) { localStorage.setItem(WEEK_COLLAPSE_KEY, JSON.stringify(c)); }
function getDone() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function setDone(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

let activeDay = null;

function toggleWeek(num) {
  const c = getCollapsed();
  c[num] = !c[num];
  setCollapsed(c);
  renderSidebar();
}

function renderSidebar() {
  const done = getDone();
  const collapsed = getCollapsed();
  const list = document.getElementById("day-list");
  list.innerHTML = "";

  WEEKS.forEach(w => {
    const weekDays = DAYS.filter(d => d.day >= w.from && d.day <= w.to);
    const weekDone = weekDays.filter(d => done[d.day]).length;
    const isCollapsed = !!collapsed[w.num];

    const group = document.createElement("li");
    group.className = "week-group" + (isCollapsed ? " collapsed" : "");

    const header = document.createElement("div");
    header.className = "week-header";
    header.onclick = () => toggleWeek(w.num);
    header.innerHTML = `
      <span class="week-caret">▼</span>
      <div class="week-info">
        <div class="week-title">${w.title}</div>
        <div class="week-sub">${w.sub}</div>
      </div>
      <span class="week-count">${weekDone}/${weekDays.length}</span>`;
    group.appendChild(header);

    weekDays.forEach(d => {
      const item = document.createElement("div");
      item.className = "day-item" + (done[d.day] ? " done" : "") + (activeDay === d.day ? " active" : "");
      item.onclick = () => loadDay(d.day);
      item.innerHTML = `
        <div class="day-check">✓</div>
        <div class="day-meta">
          <div class="day-num">Day ${d.day} · <span class="diff-dot diff-${d.diff}">${d.diff}</span></div>
          <div class="day-title">${d.title}</div>
        </div>`;
      group.appendChild(item);
    });

    list.appendChild(group);
  });

  const doneCount = DAYS.filter(d => done[d.day]).length;
  document.getElementById("progress-bar").style.width = (doneCount / DAYS.length * 100) + "%";
  document.getElementById("progress-text").textContent = `${doneCount} / ${DAYS.length} completed`;
}

async function loadDay(day) {
  activeDay = day;
  renderSidebar();
  const meta = DAYS.find(d => d.day === day);
  const inner = document.getElementById("content-inner");
  const toolbar = document.getElementById("content-toolbar");
  toolbar.style.display = "flex";
  document.getElementById("toolbar-title").textContent = `Day ${day}: ${meta.title}`;
  updateMarkBtn();
  inner.innerHTML = `<p style="color:var(--text-dim)">Loading…</p>`;
  try {
    const res = await fetch(`day${day}/CHALLENGE.md`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    inner.innerHTML = `<div class="md">${marked.parse(md)}</div>`;
    inner.querySelectorAll("pre code").forEach(block => {
      if (window.hljs) hljs.highlightElement(block);
    });
    document.getElementById("content").scrollTop = 0;
  } catch (e) {
    inner.innerHTML = `<div class="error-box">
      <strong>Couldn't load <code>day${day}/CHALLENGE.md</code></strong>
      <p>Browsers block <code>fetch()</code> on <code>file://</code> URLs. Serve this folder over HTTP:</p>
      <pre><code>cd ${"$(pwd)"}\npython3 -m http.server 8000</code></pre>
      <p>then open <code>http://localhost:8000/challenge.html</code></p>
      <p style="color:var(--text-dim);font-size:12px">(${e.message})</p>
    </div>`;
  }
}

function updateMarkBtn() {
  const btn = document.getElementById("mark-btn");
  const done = getDone();
  if (done[activeDay]) {
    btn.classList.add("done");
    btn.textContent = "✓ Completed";
  } else {
    btn.classList.remove("done");
    btn.textContent = "Mark as Done";
  }
}

document.getElementById("mark-btn").onclick = () => {
  const done = getDone();
  if (done[activeDay]) delete done[activeDay];
  else done[activeDay] = true;
  setDone(done);
  updateMarkBtn();
  renderSidebar();
};

renderSidebar();
</script>
</body>
</html>
